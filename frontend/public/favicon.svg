<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Prismatic rainbow caustic gradient -->
    <linearGradient id="fav-caustic" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8DF0EC"/>
      <stop offset="25%" stopColor="#FDF7A8"/>
      <stop offset="50%" stopColor="#FFA4E0"/>
      <stop offset="75%" stopColor="#CCA8FD"/>
      <stop offset="100%" stopColor="#98C8FE"/>
    </linearGradient>
    <!-- Pearl glass fill -->
    <linearGradient id="fav-pearl" x1="8" y1="6" x2="30" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="50%" stopColor="#F2F5FB"/>
      <stop offset="100%" stopColor="#E6ECF8"/>
    </linearGradient>
    <!-- Specular highlight sheen -->
    <linearGradient id="fav-sheen" x1="10" y1="8" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.95"/>
      <stop offset="50%" stopColor="#FFFFFF" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0"/>
    </linearGradient>
  </defs>
  <!-- Pearl white backdrop orb with soft border -->
  <circle cx="20" cy="20" r="18" fill="#FDFCF8" stroke="rgba(126,137,202,0.22)" stroke-width="1.5"/>
  <!-- Outer caustic rim for the liquid L -->
  <path d="M8 11 C8 8.5, 10.5 6, 13 6 C15.5 6, 18 8.5, 18 11 L18 22 C18 23.5, 19.5 25, 21 25 L26 25 C28.5 25, 31 27.5, 31 30 C31 32.5, 28.5 35, 26 35 L13 35 C10.5 35, 8 32.5, 8 30 Z" fill="url(#fav-caustic)"/>
  <!-- Inner pearl body -->
  <path d="M9.5 11.5 C9.5 9.5, 11 8, 13 8 C15 8, 16.5 9.5, 16.5 11.5 L16.5 22.5 C16.5 24.5, 18.5 26.5, 20.5 26.5 L26 26.5 C28 26.5, 29.5 28, 29.5 30 C29.5 32, 28 33.5, 26 33.5 L13 33.5 C11 33.5, 9.5 32, 9.5 30 Z" fill="url(#fav-pearl)"/>
  <!-- Specular highlight streak -->
  <path d="M13 9 L13 23 C13 26, 15 28, 18 28 L27 28" stroke="url(#fav-sheen)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Spark node -->
  <circle cx="27" cy="13" r="5.5" fill="url(#fav-caustic)"/>
  <circle cx="27" cy="13" r="3.2" fill="#FFFFFF"/>
  <circle cx="27" cy="13" r="1.5" fill="#8DF0EC"/>
</svg>